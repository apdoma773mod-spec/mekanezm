const SB_URL='https://tkzfjeizvanfptnqvrmr.supabase.co',SB_KEY='sb_publishable_8QP_KfvoYOyF_bZC4-fw1w_qCkfEpvZ';
const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{v=parseFloat(String(v).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(',','.'));return isFinite(v)?v:0};
const WA='201042383986';
const KIND={steel:'🔩 استانلس حماية الباب',bamboo:'🎍 درج بامبو',delf:'🚪 دلف الدريسنج روم'};
let K=null,V={},DRAW=null;

/* ---------- رسم ---------- */
const F='font-family="Segoe UI,Tahoma,Arial,sans-serif"';
const dimH=(x1,x2,y,t)=>`<g stroke="#a8741a" stroke-width="1.4" fill="#a8741a"><line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/><path d="M${x1} ${y}l7 -3.5v7zM${x2} ${y}l-7 -3.5v7z"/><line x1="${x1}" y1="${y-5}" x2="${x1}" y2="${y+5}"/><line x1="${x2}" y1="${y-5}" x2="${x2}" y2="${y+5}"/></g><text x="${(x1+x2)/2}" y="${y+16}" text-anchor="middle" font-size="13" font-weight="700" fill="#12202b" ${F}>${esc(t)}</text>`;
const dimV=(x,y1,y2,t,side)=>`<g stroke="#a8741a" stroke-width="1.4" fill="#a8741a"><line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"/><path d="M${x} ${y1}l-3.5 7h7zM${x} ${y2}l-3.5 -7h7z"/><line x1="${x-5}" y1="${y1}" x2="${x+5}" y2="${y1}"/><line x1="${x-5}" y1="${y2}" x2="${x+5}" y2="${y2}"/></g><text x="${x+(side||-1)*8}" y="${(y1+y2)/2+4}" text-anchor="${side>0?'start':'end'}" font-size="13" font-weight="700" fill="#12202b" ${F}>${esc(t)}</text>`;
const svgWrap=b=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="800" height="600" direction="ltr" style="direction:ltr"><rect width="400" height="300" fill="#fff"/><rect x="2" y="2" width="396" height="296" rx="10" fill="none" stroke="#d9a73a" stroke-width="2"/><text x="200" y="22" text-anchor="middle" font-size="13" font-weight="800" fill="#a8741a" ${F}>MEKANEZM — رسم توضيحي للطلب</text>${b}</svg>`;

function drawSteel(v){const t=num(v.t),W=num(v.w),hf=num(v.hf),hb=num(v.hb);if(!(t>0&&W>0&&hf>0&&hb>0))return '';
 const m=Math.max(hf,hb),k=Math.min(165/(m*1.35),95/t),dh=185,x0=105-t*k/2,yb=250,yt=yb-dh,tw=t*k;
 const side=`<rect x="${x0}" y="${yt}" width="${tw}" height="${dh}" fill="#c9a77a" stroke="#6b4a1f" stroke-width="1.5"/><text x="${x0+tw/2}" y="${yt+60}" text-anchor="middle" font-size="11" fill="#6b4a1f" ${F} transform="rotate(-90 ${x0+tw/2} ${yt+60})">الباب</text>
  <path d="M${x0-4} ${yb-hf*k}V${yb+4}H${x0+tw+4}V${yb-hb*k}" fill="none" stroke="#6aa5c9" stroke-width="5" stroke-linejoin="round"/><path d="M${x0-4} ${yb-hf*k}V${yb+4}H${x0+tw+4}V${yb-hb*k}" fill="none" stroke="#e6f3fb" stroke-width="1.4"/>
  ${dimV(x0-16,yb-hf*k,yb,hf+' سم',-1)}${dimV(x0+tw+16,yb-hb*k,yb,hb+' سم',1)}${dimH(x0,x0+tw,yb+22,t+' سم')}<text x="${x0-12}" y="${yt-8}" font-size="12" font-weight="800" fill="#12202b" ${F}>الوش</text><text x="${x0+tw+12}" y="${yt-8}" font-size="12" font-weight="800" fill="#12202b" ${F}>الضهر</text>`;
 const fw=130,fx=250,fh=dh,bh=Math.max(16,Math.min(130,hf*2.2));
 const front=`<rect x="${fx}" y="${yt}" width="${fw}" height="${fh}" fill="#c9a77a" stroke="#6b4a1f" stroke-width="1.5"/><rect x="${fx}" y="${yb-bh}" width="${fw}" height="${bh}" fill="#6aa5c9" stroke="#3a6f93"/><rect x="${fx}" y="${yb-bh}" width="${fw}" height="${bh*.35}" fill="#e6f3fb" opacity=".55"/>${dimH(fx,fx+fw,yb+22,'عرض الباب '+W+' سم')}<text x="${fx+fw/2}" y="${yt+fh/2-bh/2}" text-anchor="middle" font-size="12" fill="#6b4a1f" ${F}>منظر أمامي</text>`;
 return svgWrap(side+front+`<text x="105" y="${yt-26}" text-anchor="middle" font-size="12" fill="#667" ${F}>قطاع جانبي</text>`)}

function drawBamboo(v){const w=num(v.w),l=num(v.l),h=num(v.h);if(!(w>0&&l>0&&h>0))return '';
 const k=Math.min(200/(w+.28*l),165/(h+.5*l)),fw=w*k,fh=h*k,dx=l*k*.28,dy=-l*k*.5,x0=118+(200-(fw+dx))/2,yb=240,yt=yb-fh;
 const nat=v.kind==='طبيعي',B=nat?['#d9b98a','#eed5a8','#a47c48']:['#c8a05e','#e0bf83','#8c6a30'];
 const dv=v.split==='yes'?Math.max(1,Math.min(10,Math.round(num(v.dv)||0))):0;
 const Fl=[x0,yt],Fr=[x0+fw,yt],Bl=[x0+dx,yt+dy],Br=[x0+fw+dx,yt+dy],P=(a,d)=>`${a[0]},${a[1]+(d||0)}`;
 const poly=(pts,fill,sh)=>`<polygon points="${pts}" fill="${fill}" stroke="#5e4220" stroke-width="1.2" stroke-linejoin="round"/>`+(sh?`<polygon points="${pts}" fill="#2b1a05" opacity="${sh}"/>`:'');
 const defs=`<defs><pattern id="wv" width="14" height="9" patternUnits="userSpaceOnUse"><rect width="14" height="9" fill="${B[0]}"/><path d="M0 2.2h14M0 6.7h14" stroke="${B[1]}" stroke-width="2.6"/><path d="M0 3.9h14M0 8.4h14" stroke="${B[2]}" stroke-width=".8" opacity=".7"/><path d="M3.5 0v4.2M10.5 4.5v4.5" stroke="${B[2]}" stroke-width="2.4"/><path d="M5 0v4M12 4.5v4.5" stroke="${B[1]}" stroke-width=".8"/></pattern></defs>`;
 const W='url(#wv)';
 let s=defs;
 s+=poly(`${P(Fl)} ${P(Bl)} ${P(Bl,fh)} ${P(Fl,fh)}`,W,.3);          /* الجدار الداخلي الشمال */
 s+=poly(`${P(Bl)} ${P(Br)} ${P(Br,fh)} ${P(Bl,fh)}`,W,.2);           /* الجدار الداخلي الخلفي */
 s+=poly(`${P(Bl,fh)} ${P(Br,fh)} ${P(Fr,fh)} ${P(Fl,fh)}`,W,.1);     /* الأرضية */
 for(let i=1;i<=dv;i++){const f=i/(dv+1),ax=x0+fw*f,bx=ax+dx;                      /* الفواصل */
  s+=`<polygon points="${ax},${yt} ${bx},${yt+dy} ${bx},${yt+dy+fh} ${ax},${yt+fh}" fill="#e7d3aa" stroke="#5e4220" stroke-width="1.2"/><line x1="${ax}" y1="${yt}" x2="${bx}" y2="${yt+dy}" stroke="#a47c48" stroke-width="3"/>`}
 s+=poly(`${P(Fr)} ${P(Br)} ${P(Br,fh)} ${P(Fr,fh)}`,W,.12);          /* الجنب اليمين من برّه */
 s+=poly(`${P(Fl)} ${P(Fr)} ${P(Fr,fh)} ${P(Fl,fh)}`,W,0);            /* الوش */
 const rim=(a,b)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#7a5a2a" stroke-width="7.5" stroke-linecap="round"/><line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${B[1]}" stroke-width="5.8" stroke-linecap="round"/><line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#8d6a38" stroke-width="5.8" stroke-dasharray="2.2 4.6"/>`;
 s+=rim(Bl,Fl)+rim(Bl,Br)+rim(Fr,Br)+rim(Fl,Fr);                       /* الحافة المضفّرة */
 s+=dimH(x0,x0+fw,yb+22,'العرض '+w+' سم')+dimV(x0-14,yt,yb,'الارتفاع '+h+' سم',-1);
 s+=`<g stroke="#a8741a" stroke-width="1.4" fill="#a8741a"><line x1="${x0+fw+14}" y1="${yt+6}" x2="${x0+fw+dx+14}" y2="${yt+dy+6}"/><path d="M${x0+fw+14} ${yt+6}l-2 -7 8 3zM${x0+fw+dx+14} ${yt+dy+6}l2 7 -8 -3z"/></g><text x="${x0+fw+dx/2+30}" y="${yt+dy/2+6}" font-size="13" font-weight="700" fill="#12202b" ${F}>الطول ${l} سم</text>`;
 s+=`<text x="200" y="293" text-anchor="middle" font-size="11" fill="#667" ${F}>${esc(v.kind||'')} — ${dv?('متقسم '+dv+' فاصل'):'بدون تقسيم'} — المقاس برّه برّه</text>`;
 return svgWrap(s)}

function drawDelf(v){const W=num(v.w),H=num(v.h);if(!(W>0&&H>0))return '';
 const k=Math.min(165/W,165/H),dw=W*k,dh=H*k,x0=122,y0=62,ps=Math.max(6,Math.min(12,3.5*k)),hw=Math.max(ps+3,Math.min(18,6.5*k)),tr=Math.max(8,Math.min(14,4.5*k));
 const hL=v.handle==='both'||(v.handle==='one'&&v.hside==='left'),hR=v.handle==='both'||(v.handle==='one'&&v.hside!=='left');
 const wl=hL?hw:ps,wr=hR?hw:ps;
 const defs=`<defs><linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9f1f5"/><stop offset=".5" stop-color="#cfdde5"/><stop offset="1" stop-color="#b9cbd6"/></linearGradient><linearGradient id="bk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a2d31"/><stop offset=".5" stop-color="#4a4f55"/><stop offset="1" stop-color="#1c1e21"/></linearGradient><linearGradient id="al" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8d98a1"/><stop offset=".4" stop-color="#f4f6f8"/><stop offset="1" stop-color="#7b8791"/></linearGradient></defs>`;
 let s=defs+`<rect x="${x0}" y="${y0}" width="${dw}" height="${dh}" rx="2" fill="url(#bk)" stroke="#111" stroke-width="1"/><rect x="${x0+wl}" y="${y0+tr}" width="${dw-wl-wr}" height="${dh-2*tr}" fill="url(#gl)" stroke="#8d98a1" stroke-width="1.2"/><path d="M${x0+wl+8} ${y0+dh-tr-8}L${x0+wl+Math.min(56,dw*.4)} ${y0+tr+8}M${x0+wl+20} ${y0+dh-tr-8}L${x0+wl+Math.min(68,dw*.4+12)} ${y0+tr+8}" stroke="#fff" stroke-width="5" opacity=".55"/>`;
 /* المقبض: القايم نفسه بروفيل فيه شفة سحب بطول الدلفة */
 [[hL,x0,1],[hR,x0+dw-hw,-1]].forEach(a=>{if(!a[0])return;const x=a[1];s+=`<rect x="${x}" y="${y0}" width="${hw}" height="${dh}" fill="url(#al)" stroke="#59636c" stroke-width="1"/><rect x="${a[2]>0?x+hw-4:x+1.5}" y="${y0+tr}" width="2.5" height="${dh-2*tr}" fill="#2a2d31"/><line x1="${a[2]>0?x+hw*.35:x+hw*.65}" y1="${y0+4}" x2="${a[2]>0?x+hw*.35:x+hw*.65}" y2="${y0+dh-4}" stroke="#fff" stroke-width="1.4" opacity=".8"/>`});
 if(v.type==='hinged'&&v.drill==='yes'){const n=Math.max(1,Math.min(8,Math.round(num(v.hn)||2))),left=v.hinge==='left',hx=left?x0+wl/2:x0+dw-wr/2;for(let i=0;i<n;i++){const y=n===1?y0+dh/2:y0+tr+14+(dh-2*tr-28)*i/(n-1);s+=`<circle cx="${hx}" cy="${y}" r="${Math.min(5,Math.max(2.5,(left?wl:wr)/2-1.2))}" fill="#cfd6dc" stroke="#111" stroke-width="1.2"/><circle cx="${hx}" cy="${y}" r="1.5" fill="#111"/>`}}
 /* العجل: في الراس (فوق) والرجل (تحت) عند الأطراف */
 if(v.type==='slide'&&v.wheel==='yes'){const xs=[x0+dw*.1,x0+dw*.9-14];xs.forEach(x=>{
   s+=`<rect x="${x-2}" y="${y0}" width="18" height="${tr}" fill="none" stroke="#e24c3b" stroke-width="1.5" stroke-dasharray="3 2"/><rect x="${x}" y="${y0+1}" width="14" height="${tr-2}" rx="1.5" fill="#7b8084" stroke="#33383c"/><circle cx="${x+7}" cy="${y0-5}" r="6.5" fill="#cfd6dc" stroke="#33383c" stroke-width="1.3"/><circle cx="${x+7}" cy="${y0-5}" r="2" fill="#33383c"/>
   <rect x="${x-2}" y="${y0+dh-tr}" width="18" height="${tr}" fill="none" stroke="#e24c3b" stroke-width="1.5" stroke-dasharray="3 2"/><rect x="${x}" y="${y0+dh-tr+1}" width="14" height="${tr-2}" rx="1.5" fill="#7b8084" stroke="#33383c"/><circle cx="${x+7}" cy="${y0+dh+5}" r="6.5" fill="#cfd6dc" stroke="#33383c" stroke-width="1.3"/><circle cx="${x+7}" cy="${y0+dh+5}" r="2" fill="#33383c"/>`})}
 /* قطاع المقبض */
 s+=`<g transform="translate(288 ${y0+10})"><text x="46" y="-6" text-anchor="middle" font-size="11" font-weight="700" fill="#12202b" ${F}>قطاع القايم</text><rect x="22" y="10" width="34" height="46" rx="2" fill="url(#bk)" stroke="#111"/><rect x="56" y="24" width="36" height="6" fill="url(#gl)" stroke="#8d98a1"/>${(hL||hR)?`<path d="M26 22h-16v26h12" fill="none" stroke="#c9d1d8" stroke-width="6" stroke-linejoin="round"/><path d="M26 22h-16v26h12" fill="none" stroke="#59636c" stroke-width="1"/><text x="46" y="76" text-anchor="middle" font-size="10" fill="#667" ${F}>شفة سحب في البروفيل</text>`:`<text x="46" y="76" text-anchor="middle" font-size="10" fill="#667" ${F}>بدون مقبض</text>`}</g>`;
 s+=dimH(x0,x0+dw,y0+dh+24,'العرض '+W+' سم')+dimV(x0-14,y0,y0+dh,'الارتفاع '+H+' سم',-1);
 const lab=(v.type==='hinged'?'مفصلي':'جرار')+' — إطار ألمنيوم أسود وزجاج — '+({none:'بدون مقبض',one:'مقبض من ناحية',both:'مقبض من الناحيتين'}[v.handle]||'');
 return svgWrap(s+`<text x="200" y="294" text-anchor="middle" font-size="11" fill="#667" ${F}>${esc(lab)}</text>`)}

const GUIDE={steel:'قيس سُمك الباب من الوش للضهر، وعرضه من حافة لحافة. بعدين حدّد ارتفاع الاستانلس اللي عايزه من تحت لفوق على الوش، وعلى الضهر. كل المقاسات بالسنتيمتر.',bamboo:'قيس الفتحة اللي الدرج هيتركّب فيها من برّه لبرّه: العرض، الطول (من الوش للضهر)، والارتفاع (هو عمق الدرج). لو عايزه متقسم حدّد عدد الفواصل.',delf:'قيس عرض الدلفة من حافة لحافة وارتفاعها من فوق لتحت بالسنتيمتر. للمفصلي اختار تتخرّم ولا لأ وعدد المفصلات (هنقترحلك عدد حسب الارتفاع). للجرار اختار فتحة العجلة لو محتاجها.'};

const DRAWERS={steel:drawSteel,bamboo:drawBamboo,delf:drawDelf};

/* ---------- نموذج ---------- */
const chips=(k,opts)=>`<div class="ch" data-k="${k}">${opts.map(o=>`<button type="button" data-v="${o[0]}" class="${V[k]===o[0]?'on':''}">${o[1]}</button>`).join('')}</div>`;
const QK={t:[3,4,5],hf:[10,15,20],hb:[10,15,20],w:null,h:null};

function qk(k){const a=(K==='delf'?QDELF[k]:K==='steel'?(QSTEEL[k]||QK[k]):QK[k]);return a?'<div class="qk">'+a.map(v=>'<button type="button" data-qk="'+k+'" data-v="'+v+'">'+v+'</button>').join('')+'</div>':''}
const fld=(k,l,ph,extra)=>`<div class="f"><label>${l}</label><input data-i="${k}" value="${esc(V[k]||'')}" inputmode="decimal" placeholder="${ph||''}" ${extra||''}>${qk(k)}</div>`;
function defaults(kind){return {steel:{q:1},bamboo:{kind:'طبيعي',split:'no',dv:2,q:1},delf:{type:'hinged',mat:'ألمنيوم',handle:'none',hside:'right',drill:'yes',hinge:'right',hn:'3',wheel:'yes',q:1}}[kind]}
function formHTML(){
 if(K==='steel')return `<div class="card"><h3>🔩 مقاسات قطعة الاستانلس (حماية الباب من الرطوبة والمياه)</h3><div class="g">${fld('t','سُمك الباب (سم)','مثلاً 4')}${fld('w','عرض الباب (سم)','مثلاً 80')}${fld('hf','ارتفاع الاستانلس من الوش (سم)','مثلاً 15')}${fld('hb','ارتفاع الاستانلس من الضهر (سم)','مثلاً 15')}${fld('q','عدد القطع','1')}</div></div>`;
 if(K==='bamboo')return `<div class="card"><h3>🎍 درج البامبو</h3><label>نوع البامبو</label>${chips('kind',[['طبيعي','طبيعي'],['صناعي','صناعي']])}
  <label style="display:block;margin-top:12px">التقسيم</label>${chips('split',[['no','بدون تقسيم'],['yes','متقسم']])}
  <div id="dvbox" class="${V.split==='yes'?'':'hid'}" style="margin-top:10px">${fld('dv','عدد الفواصل','مثلاً 2')}</div>
  <div class="g" style="margin-top:12px">${fld('w','العرض (سم)','')}${fld('l','الطول (سم)','')}${fld('h','الارتفاع (سم) — هو عمق الدرج','')}${fld('q','العدد','1')}</div><div class="hint">المقاس برّه برّه (مقاس الفتحة اللي الدرج هيتركّب فيها).</div></div>`;
 return `<div class="card"><h3>🚪 دلف الدريسنج روم (إطار ألمنيوم وزجاج)</h3><label>نوع الدلفة</label>${chips('type',[['hinged','مفصلي'],['slide','جرار']])}
  <div class="g" style="margin-top:12px">${fld('w','عرض الدلفة (سم)','')}${fld('h','ارتفاع الدلفة (سم)','')}${fld('q','عدد الدلف','1')}</div>
  <label style="display:block;margin-top:12px">المقبض</label>${chips('handle',[['none','بدون مقبض'],['one','مقبض من ناحية'],['both','مقبض من الناحيتين']])}
  <div id="hsbox" class="${V.handle==='one'?'':'hid'}" style="margin-top:8px"><label>ناحية المقبض</label>${chips('hside',[['right','يمين'],['left','شمال']])}</div>
  <div id="hgbox" class="${V.type==='hinged'?'':'hid'}" style="margin-top:12px"><label>تتخرّم الدلفة للمفصلات؟</label>${chips('drill',[['yes','أيوه، اخرّموها'],['no','لأ']])}
   <div id="hgn" class="${V.drill==='yes'?'':'hid'}" style="margin-top:8px"><div class="g">${fld('hn','عدد المفصلات في الدلفة','3')}<div class="f"><label>ناحية المفصلات</label>${chips('hinge',[['right','يمين'],['left','شمال']])}</div></div></div></div>
  <div id="whbox" class="${V.type==='slide'?'':'hid'}" style="margin-top:12px"><label>تتخلّع الدلفة لفتحة العجلة؟</label>${chips('wheel',[['yes','أيوه'],['no','لأ']])}<div class="hint">العجلة بنبيعها لوحدها وبتتركّب على الصايت.</div></div></div>`}
function show(id){['dvbox','hsbox','hgbox','hgn','whbox'].forEach(x=>{const e=$(x);if(!e)return;const on={dvbox:V.split==='yes',hsbox:V.handle==='one',hgbox:V.type==='hinged',hgn:V.drill==='yes',whbox:V.type==='slide'}[x];e.classList.toggle('hid',!on)})}
const DK=()=>'mk_cust_'+K;function save(){try{localStorage.setItem(DK(),JSON.stringify(V))}catch(e){}}
function hn0(h){return h<=90?2:h<=160?3:h<=220?4:5}
function warns(){const W=[],t=num(V.t),w=num(V.w),h=num(V.h),hf=num(V.hf),hb=num(V.hb),l=num(V.l);
 if(K==='steel'){if(t>12)W.push('سُمك الباب '+t+' سم كبير — اتأكد إنه بالسنتيمتر');if(w>150)W.push('عرض الباب '+w+' سم — اتأكد من المقاس');if(w&&hf&&hf>w)W.push('ارتفاع الوش أكبر من عرض الباب — اتأكد');}
 if(K==='bamboo'){[['العرض',w],['الطول',l],['الارتفاع',h]].forEach(a=>{if(a[1]>150)W.push(a[0]+' '+a[1]+' سم كبير على درج بامبو — اتأكد');if(a[1]>0&&a[1]<5)W.push(a[0]+' '+a[1]+' سم صغير جداً — اتأكد إنه بالسنتيمتر')});if(V.split==='yes'&&w&&num(V.dv)>Math.floor(w/12))W.push('عدد الفواصل كتير على العرض ده')}
 if(K==='delf'){if(V.type==='hinged'&&w>70)W.push('الدلفة المفصلية بعرض '+w+' سم تقيلة — الأفضل تقسيمها لدلفتين');if(h>260)W.push('ارتفاع '+h+' سم — اتأكد من المقاس');if(w&&w<20)W.push('عرض صغير جداً — اتأكد');
  if(V.type==='hinged'&&V.drill==='yes'&&h>0){const s=hn0(h);if(Math.round(num(V.hn))!==s)W.push('مقترح لارتفاع '+h+' سم: '+s+' مفصلات <button type="button" data-hn="'+s+'">اعتمد</button>')}}
 const e=document.getElementById('wn');if(e)e.innerHTML=W.map(x=>'<div>⚠️ '+x+'</div>').join('')}
function redraw(){const f=DRAWERS[K];const h=f(V);$('dr').innerHTML=h||'<div style="padding:30px;text-align:center;color:#889">اكتب المقاسات وهتظهر الرسمة هنا</div>';DRAW=h;warns()}
function openForm(kind){K=kind;V=Object.assign({},defaults(kind));try{const d=JSON.parse(localStorage.getItem('mk_cust_'+kind)||'null');if(d&&typeof d==='object')Object.assign(V,d)}catch(e){}
 $('app').innerHTML=`<h1>${KIND[kind]}</h1><p class="s">اختار المواصفات واكتب المقاسات — الرسمة بتتحدّث قدامك.</p>${STEPS}<details class="card"><summary style="font-weight:800;cursor:pointer">📏 إزاي أقيس؟</summary><p style="margin:8px 0 0;line-height:1.8">${GUIDE[kind]}</p></details>${formHTML()}<div class="dr" id="dr"></div><div id="wn" class="wn"></div>
 <div class="card"><h3>بياناتك</h3><div class="g"><div class="f"><label>اسمك</label><input id="cn" maxlength="80" autocomplete="name" name="name"></div><div class="f"><label>رقم موبايلك (واتساب)</label><input id="cp" type="tel" autocomplete="tel" name="tel" inputmode="tel" maxlength="20" placeholder="01xxxxxxxxx"></div><div class="f full"><label>ملاحظات (اختياري)</label><textarea id="cnote" rows="2" maxlength="300"></textarea></div></div></div>
 <div class="msg" id="msg"></div><button class="cta" id="rv">راجع الطلب وأكّده</button><button class="cta l" id="bk">← اختيار منتج تاني</button><div class="cc"><a target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent('السلام عليكم، عندي سؤال عن تجهيز '+KIND[kind])}">💬 عندي سؤال</a><a href="tel:01042383986">📞 اتصل بنا</a></div>`;
 history.replaceState(null,'','?k='+kind);redraw();
 $('app').oninput=e=>{const i=e.target.dataset.i;if(i){V[i]=e.target.value;redraw();save()}};
 $('app').onclick=e=>{const hb2=e.target.closest('[data-hn]');if(hb2){V.hn=hb2.dataset.hn;const i=document.querySelector('[data-i="hn"]');if(i)i.value=V.hn;redraw();save();return}const q=e.target.closest('[data-qk]');if(q){V[q.dataset.qk]=q.dataset.v;const inp=document.querySelector('[data-i="'+q.dataset.qk+'"]');if(inp)inp.value=q.dataset.v;redraw();save();return}const b=e.target.closest('.ch button');if(!b)return;const k=b.parentElement.dataset.k;V[k]=b.dataset.v;b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));show();redraw()};
 $('bk').onclick=home;$('rv').onclick=review}
function home(){K=null;history.replaceState(null,'',location.pathname);$('app').innerHTML=`<h1>جهّز منتجك بمقاسك</h1><p class="s">اختار اللي عايز تجهّزه، اكتب المقاسات، وهتشوف رسمة شغلك قبل ما تأكّد.</p>
 <button class="pk" data-k="steel"><svg viewBox="0 0 112 90"><rect width="112" height="90" fill="#0f2433"/><rect x="30" y="12" width="26" height="66" fill="#c9a77a"/><path d="M27 40V80H59V44" fill="none" stroke="#6aa5c9" stroke-width="5"/><rect x="70" y="12" width="32" height="66" fill="#c9a77a"/><rect x="70" y="52" width="32" height="26" fill="#6aa5c9"/></svg><div><b>استانلس حماية الباب</b><span>من الرطوبة والمياه — حدّد سمك وعرض الباب وارتفاع الاستانلس من الوش والضهر</span></div></button>
 <button class="pk" data-k="bamboo"><svg viewBox="0 0 112 90"><rect width="112" height="90" fill="#0f2433"/><path d="M22 36l22 -14h50l-22 14z" fill="#d8b98a"/><rect x="22" y="36" width="50" height="34" fill="#b58f5c"/><path d="M72 36l22 -14v34l-22 14z" fill="#a98543"/><path d="M47 36l22 -14M60 36l22 -14" stroke="#6b4a1f" stroke-width="2"/></svg><div><b>درج بامبو</b><span>طبيعي أو صناعي — متقسم أو بدون تقسيم — بمقاس العرض والطول والارتفاع</span></div></button>
 <button class="pk" data-k="delf"><svg viewBox="0 0 112 90"><rect width="112" height="90" fill="#0f2433"/><rect x="18" y="10" width="36" height="70" rx="2" fill="#cfd6dc" stroke="#6f7a84" stroke-width="2"/><rect x="58" y="10" width="36" height="70" rx="2" fill="#cfd6dc" stroke="#6f7a84" stroke-width="2"/><rect x="47" y="38" width="4" height="16" rx="2" fill="#a8741a"/><rect x="61" y="38" width="4" height="16" rx="2" fill="#a8741a"/><circle cx="24" cy="24" r="3" fill="#12202b"/><circle cx="24" cy="66" r="3" fill="#12202b"/></svg><div><b>دلف الدريسنج روم</b><span>مفصلي أو جرار — مقبض من ناحية أو الاتنين أو بدون — تخريم مفصلات أو فتحة للعجلة</span></div></button>
 <a class="cta l" style="display:block;text-align:center;text-decoration:none" href="shop.html?track=">📦 تتبّع طلب تجهيز</a>`;
 $('app').oninput=null;$('app').onclick=e=>{const b=e.target.closest('.pk');if(b)openForm(b.dataset.k)}}

/* ---------- مراجعة وإرسال ---------- */
function summary(){const q=Math.max(1,Math.round(num(V.q))||1);let L=[KIND[K]+' — عدد '+q];
 if(K==='steel')L.push('سُمك الباب: '+V.t+' سم','عرض الباب: '+V.w+' سم','الاستانلس من الوش: '+V.hf+' سم','الاستانلس من الضهر: '+V.hb+' سم','طول الشريحة المفرودة: '+(Math.round((num(V.hf)+num(V.t)+num(V.hb))*10)/10)+' سم (حدّين ثنية)');
 if(K==='bamboo')L.push('النوع: '+V.kind,V.split==='yes'?'متقسم — '+(Math.round(num(V.dv))||0)+' فاصل':'بدون تقسيم','العرض: '+V.w+' سم','الطول: '+V.l+' سم','الارتفاع (العمق): '+V.h+' سم','المقاس برّه برّه');
 if(K==='delf'){L.push('النوع: '+(V.type==='hinged'?'مفصلي':'جرار'),'العرض: '+V.w+' سم','الارتفاع: '+V.h+' سم','المقبض: '+({none:'بدون مقبض',one:'من ناحية '+(V.hside==='left'?'الشمال':'اليمين'),both:'من الناحيتين'}[V.handle]));
  if(V.type==='hinged')L.push(V.drill==='yes'?'تخريم مفصلات: '+(Math.round(num(V.hn))||0)+' مفصلة — ناحية '+(V.hinge==='left'?'الشمال':'اليمين'):'من غير تخريم مفصلات');
  else L.push(V.wheel==='yes'?'تتخلّع لفتحة العجلة (العجلة بتتباع لوحدها)':'من غير فتحة عجلة')}
 return L.join('\n')}
function validate(){const n=x=>num(V[x])>0;
 if(K==='steel'&&!(n('t')&&n('w')&&n('hf')&&n('hb')))return 'اكتب كل المقاسات';
 if(K==='bamboo'&&(!(n('w')&&n('l')&&n('h'))||(V.split==='yes'&&!(num(V.dv)>=1))))return 'اكتب العرض والطول والارتفاع'+(V.split==='yes'?' وعدد الفواصل':'');
 if(K==='delf'&&(!(n('w')&&n('h'))||(V.type==='hinged'&&V.drill==='yes'&&!(num(V.hn)>=1))))return 'اكتب عرض وارتفاع الدلفة'+(V.type==='hinged'&&V.drill==='yes'?' وعدد المفصلات':'');
 const nm=$('cn').value.trim(),ph=$('cp').value.trim();if(nm.length<2)return 'اكتب اسمك';if(ph.replace(/\D/g,'').length<8)return 'اكتب رقم موبايلك عشان نكلّمك';return ''}
function review(){const e=validate();$('msg').textContent=e;if(e)return;
 const ov=document.createElement('div');ov.className='ov';ov.innerHTML=`<div><h3 style="margin:0 0 8px">راجع طلبك</h3><div class="dr">${DRAW}</div><div class="card sum">${esc(summary())}\n\n👤 ${esc($('cn').value.trim())} — ${esc($('cp').value.trim())}</div><div class="msg" id="omsg"></div><button class="cta" id="ok">✔ تأكيد وإرسال الطلب</button><button class="cta l" id="no">تعديل</button></div>`;
 document.body.appendChild(ov);$('no').onclick=()=>ov.remove();ov.onclick=e=>{if(e.target===ov)ov.remove()};$('ok').onclick=()=>send(ov)}
function svgToJpeg(svg){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=800;c.height=600;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,800,600);x.drawImage(im,0,0,800,600);c.toBlob(b=>b?res(b):rej(new Error('img')),'image/jpeg',.88)};im.onerror=rej;im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)})}
async function send(ov){const b=$('ok'),m=$('omsg');b.disabled=true;m.textContent='⏳ جاري تجهيز الرسمة…';
 const nm=$('cn').value.trim(),ph=$('cp').value.trim(),user=$('cnote').value.trim();
 try{const blob=await svgToJpeg(DRAW);m.textContent='⏳ جاري رفع الرسمة…';
  const path='r/'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9)+'.jpg';
  const r=await fetch(SB_URL+'/storage/v1/object/customer-requests/'+path,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'image/jpeg','cache-control':'max-age=31536000'},body:blob});
  if(!r.ok)throw new Error('upload');const url=SB_URL+'/storage/v1/object/public/customer-requests/'+path;
  const spec=Object.assign({k:K},V,{q:Math.max(1,Math.round(num(V.q))||1)});
  m.textContent='⏳ جاري الإرسال…';
  const r2=await fetch(SB_URL+'/rest/v1/rpc/place_custom_order',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY},body:JSON.stringify({p_kind:K,p_name:nm,p_phone:ph,p_spec:spec,p_summary:summary(),p_note:user,p_img:url})});
  const t=await r2.text();let j=null;try{j=JSON.parse(t)}catch(e){}
  if(!r2.ok||typeof j!=='string'){const em=(j&&j.message)||'';m.textContent=em==='invalid_phone'?'رقم الموبايل مش صحيح':em==='too_many_requests'?'في ضغط دلوقتي، جرّب بعد شوية':'ماتبعتش — جرّب تاني أو كلمنا على الواتساب';b.disabled=false;return}
  ov.remove();const ref=j.slice(0,8);try{localStorage.setItem("mk_last_order",JSON.stringify({ref,phone:ph}))}catch(e){}done(nm,summary(),ref)
 }catch(e){m.textContent='مفيش اتصال أو حصلت مشكلة — جرّب تاني';b.disabled=false}}
function done(nm,sum,ref){$('app').innerHTML=`<h1>وصلنا طلبك ✔</h1><p class="s">هنراجع المقاسات ونكلّمك على الواتساب نأكّد السعر وميعاد التجهيز.</p><div class="card" style="text-align:center"><div style="color:#667;font-size:13px">رقم طلبك</div><div dir="ltr" style="font-size:26px;font-weight:800;color:#a8741a;letter-spacing:.08em">${esc(ref)}</div><div class="hint">احتفظ بالرقم عشان تتابع مراحل الشغل</div><a class="cta" style="display:block;text-decoration:none;margin-top:10px;font-size:15px" href="shop.html?track=${esc(ref)}">📦 تتبّع طلبك</a></div><div class="dr">${DRAW}</div><div class="card sum">${esc(sum)}</div>
 <a class="cta g2" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent('السلام عليكم، أنا '+nm+' بعتّ طلب تجهيز من الموقع:\n'+sum)}">💬 كلّمنا على الواتساب كمان</a><button class="cta l" id="dl">⬇️ احفظ الرسمة كصورة</button><button class="cta l" id="hm">تجهيز منتج تاني</button><a class="cta l" style="text-align:center;text-decoration:none" href="shop.html">← رجوع للمتجر</a>`;$('hm').onclick=home;$('dl').onclick=async()=>{try{const b=await svgToJpeg(DRAW),f=new File([b],'mekanezm-'+ref+'.jpg',{type:'image/jpeg'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'طلب تجهيز ميكانيزم '+ref})}else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mekanezm-'+ref+'.jpg';a.click()}}catch(e){}};try{localStorage.removeItem('mk_cust_'+K)}catch(e){}scrollTo(0,0)}

try{if(!sessionStorage.getItem('mkvc')){sessionStorage.setItem('mkvc','1');fetch(SB_URL+'/rest/v1/rpc/bump_visit',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY},body:JSON.stringify({p_page:'custom'})}).catch(()=>{})}}catch(e){}
const q=new URLSearchParams(location.search).get('k');KIND[q]?openForm(q):home();
</script>
