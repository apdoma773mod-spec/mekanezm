 const L=d.split(/\r?\n|[•●]/).map(x=>x.trim()).filter(Boolean),kv=L.filter(x=>/^[^:：]{1,30}[:：]\s*\S/.test(x));
 if(kv.length>=2&&kv.length>=L.length/2){const rest=L.filter(x=>!kv.includes(x));
  return (rest.length?`<div class="pvdesc" style="margin-bottom:8px">${esc(rest.join('\n'))}</div>`:'')+`<table class="pvspec">${kv.map(x=>{const i=x.search(/[:：]/);return `<tr><td>${esc(x.slice(0,i).trim())}</td><td>${esc(x.slice(i+1).trim())}</td></tr>`}).join('')}</table>`}
 return `<div class="pvdesc">${esc(d)}</div>`}
function pvOpen(id,noPush){const p=byId(S.products,id);if(!p)return;
 PV={id,q:1,i:0};const im=pvImgs(p),ok=stockOk(p),fv=fav.has(id),sec=byId(S.sections,p.sec)||{},
  sim=S.products.filter(x=>x.sec===p.sec&&x.id!==id).slice(0,10);
 $('pv').innerHTML=`<div class="pvtop"><button data-pv="x" aria-label="رجوع">→</button><b style="flex:1;font-size:15px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${esc(sec.name||S.name)}</b><button data-pv="sh" aria-label="مشاركة">⤴</button><button class="hrt2${fv?' on':''}" data-pv="fv" aria-label="المفضلة">♥</button></div>
 <div class="pvwrap"><div class="pvg"><div style="position:relative"><div class="pvs" id="pvs">${im.length?im.map((x,i)=>`<img src="${x}" alt="${esc(p.name)} ${i+1}"${i?' loading="lazy"':''}>`).join(''):'<div class="ph" style="display:flex;align-items:center;justify-content:center;font-size:60px">🔧</div>'}</div>
  ${im.length>1?`<button class="pvar r" data-pv="prev" aria-label="الصورة السابقة">›</button><button class="pvar l" data-pv="next" aria-label="الصورة التالية">‹</button><span class="pvcnt" id="pvcnt" dir="ltr">1 / ${im.length}</span>`:''}</div>
  ${im.length>1?`<div class="pvdots" id="pvdots">${im.map((x,i)=>`<i${i?'':' class="on"'}></i>`).join('')}</div><div class="pvth" id="pvth">${im.map((x,i)=>`<img src="${x}" data-pv="go" data-i="${i}" class="${i?'':'on'}" alt="">`).join('')}</div>`:''}</div>
 <div class="pvi"><h1>${esc(p.name)}</h1>
  <div class="pvmeta"><span class="pvav ${ok?'ok':'no'}">● ${ok?'متوفر':'غير متوفر حاليًا'}</span>${p.code?`<span>كود: ${esc(p.code)}</span>`:''}${sec.name?`<span>${esc(sec.name)}</span>`:''}</div>
  <div class="pvbox pvprice"><div><small>السعر</small><b>اسأل عن السعر</b></div><a class="pvpbtn" target="_blank" rel="noopener" href="${pvPriceUrl(p)}">💬 اسأل عن السعر</a></div>
  ${p.desc?`<div class="pvbox"><h2>المواصفات</h2>${pvSpecs(p.desc)}</div>`:''}
  <div class="pvacts"><a class="pvask" target="_blank" rel="noopener" href="${waUrl('السلام عليكم، عايز أطلب: '+p.name+(p.code?' (كود '+p.code+')':''))}">📲 اطلب على الواتساب</a></div>
  ${sim.length?`<div class="pvbox"><h2>منتجات مشابهة</h2><div class="pvsim">${sim.map(x=>`<div data-pv="o" data-id="${x.id}">${pvImgs(x)[0]?`<img src="${pvImgs(x)[0]}" alt="" loading="lazy">`:'<div class="ph">🔧</div>'}<b>${esc(x.name)}</b></div>`).join('')}</div></div>`:''}
 </div></div>`;
 pvBar();$('pv').classList.add('on');$('pv').scrollTop=0;document.body.classList.add('pvon');
 const s=$('pvs');s.scrollLeft=0;s.addEventListener('scroll',()=>{const i=Math.round(s.scrollLeft/s.clientWidth);if(i!==PV.i){PV.i=i;pvMark()}},{passive:true});
 if(!noPush){try{history.pushState({pv:id},'','#p='+id)}catch(e){}}}
function pvBar(){const p=byId(S.products,PV.id);if(!p)return;const ok=stockOk(p),n=cart[p.id]||0;
 $('pvbar').innerHTML=ok?`<div class="pvq"><button data-pv="q+" aria-label="زيادة">+</button><b>${PV.q}</b><button data-pv="q-" aria-label="نقص">−</button></div><button class="pvadd${n?' done':''}" data-pv="add">${n?`✔ في طلبك (${n}) — أضف كمان`:'➕ أضف للطلب'}</button>${n?'<button class="pvq" style="padding:0 14px;height:46px;font-weight:700" data-pv="cart">🛒 طلبي</button>':''}`:`<button class="pvadd" disabled>نفد حاليًا</button><a class="pvask" style="padding:12px 16px;border-radius:24px;text-decoration:none;font-weight:700" target="_blank" rel="noopener" href="${waUrl('السلام عليكم، عايز أعرف إمتى يتوفر: '+p.name)}">💬 اسأل</a>`}
function pvMark(){const n=document.querySelectorAll('#pvs>*').length;const c=$('pvcnt');if(c)c.textContent=(PV.i+1)+' / '+n;
 document.querySelectorAll('#pvdots i').forEach((d,k)=>d.classList.toggle('on',k===PV.i));
 document.querySelectorAll('#pvth img').forEach((d,k)=>{d.classList.toggle('on',k===PV.i);if(k===PV.i)d.scrollIntoView({block:'nearest',inline:'nearest'})})}
function pvGo(i){const s=$('pvs');if(!s)return;const n=s.children.length;PV.i=(i+n)%n;s.scrollTo({left:PV.i*s.clientWidth,behavior:'smooth'});pvMark()}
function pvClose(back){if(!$('pv').classList.contains('on'))return;$('pv').classList.remove('on');document.body.classList.remove('pvon');PV.id=null;
 if(back&&/^#p=/.test(location.hash)){try{history.back()}catch(e){}}}
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-pv]');
 if(b){const a=b.dataset.pv,p=byId(S.products,PV.id);
  if(a==='x')return pvClose(true);
  if(a==='o')return pvOpen(b.dataset.id);
  if(a==='prev')return pvGo(PV.i-1);if(a==='next')return pvGo(PV.i+1);if(a==='go')return pvGo(+b.dataset.i);
  if(!p)return;
  if(a==='q+'){PV.q++;return pvBar()}if(a==='q-'){PV.q=Math.max(1,PV.q-1);return pvBar()}
  if(a==='add'){cart[p.id]=(cart[p.id]||0)+PV.q;PV.q=1;cartUI();pvBar();return}
  if(a==='cart'){cartOpen();return}
  if(a==='fv'){fav.has(p.id)?fav.delete(p.id):fav.add(p.id);try{localStorage.setItem('mkfav',JSON.stringify([...fav]))}catch(x){}b.classList.toggle('on',fav.has(p.id));nvDraw();return}
  if(a==='sh'){const url=location.href.split('#')[0]+'#p='+p.id,d={title:p.name,text:p.name+' — '+S.name,url};
   try{if(navigator.share){await navigator.share(d);return}}catch(x){if(x&&x.name==='AbortError')return}
   try{await navigator.clipboard.writeText(url);alert('تم نسخ رابط المنتج')}catch(x){window.open(waUrl(p.name+'\n'+url),'_blank')}return}
  return}
 if(admin)return;
 if(e.target.closest('button,a,input,select,label,[data-a]'))return;
 const c=e.target.closest('.card');
 if(c){const k=c.querySelector('[data-id]');if(k&&byId(S.products,k.dataset.id))pvOpen(k.dataset.id);return}
 const pc=e.target.closest('.pc');
 if(pc){const nm=(pc.querySelector('h4')||{}).textContent,p=S.products.find(x=>x.name===nm);if(p)pvOpen(p.id)}
});
window.addEventListener('popstate',()=>{const m=/^#p=(.+)$/.exec(location.hash);if(m&&byId(S.products,m[1]))pvOpen(m[1],true);else pvClose(false)});
document.addEventListener('keydown',e=>{if(!$('pv').classList.contains('on'))return;if(e.key==='Escape')pvClose(true);else if(e.key==='ArrowLeft')pvGo(PV.i+1);else if(e.key==='ArrowRight')pvGo(PV.i-1)});
/* لما الصفحة تتفتح من رابط منتج، أو المخزون يتحدث وصفحة المنتج مفتوحة */
const _pvRender=render;render=function(){_pvRender();if(PV.id){pvBar();return}const m=/^#p=(.+)$/.exec(location.hash);if(m&&!admin&&byId(S.products,m[1]))pvOpen(m[1],true)};
const _pvCartUI=cartUI;cartUI=function(){_pvCartUI();if(PV.id)pvBar()};
if(/^#p=/.test(location.hash))render();
</script>

<script>
/* =====================================================================
   ميكانيزم — الموقع (المرحلة 3): أعمالنا، آراء العملاء، التوصيل والاستبدال، فيديو المنتج، روابط تظهر في جوجل
   ===================================================================== */
(function(){
const stars=n=>{n=Math.max(1,Math.min(5,+n||5));return '★'.repeat(n)+'☆'.repeat(5-n)};
const BASE=()=>location.origin+location.pathname;
/* ---------- أقسام الصفحة الرئيسية ---------- */
function worksHTML(){let W=(S.works||[]).filter(w=>w.imgs&&w.imgs.length);if(!W.length)return '';
 return `<section id="works"><div class="sh"><h2>🏗️ من أعمالنا</h2></div><div class="wk">${W.map((w,i)=>`<div class="wkc" data-wk="${i}"><img src="${esc(w.imgs[0])}" loading="lazy" alt="${esc(w.title)}"><div><b>${esc(w.title)}</b>${w.desc?`<small>${esc(w.desc)}</small>`:''}<span>📷 ${w.imgs.length} صور</span></div></div>`).join('')}</div></section>`}
function reviewsHTML(){let R=(S.reviews||[]).filter(r=>r.text);if(!R.length)return '';
 return `<section id="reviews"><div class="sh"><h2>⭐ آراء عملائنا</h2></div><div class="rv">${R.map(r=>`<div class="rvc"><div class="st">${stars(r.stars)}</div><p>${esc(r.text)}</p><b>${esc(r.name||'عميل')}</b>${r.area?` <small>— ${esc(r.area)}</small>`:''}</div>`).join('')}</div></section>`}
function infoHTML(){let D=(S.delivery||[]).filter(x=>x.area),pol=String(S.policy||'').trim(),note=String(S.deliveryNote||'').trim();if(!D.length&&!pol&&!note)return '';
 return `<section id="info"><div class="sh"><h2>🚚 التوصيل والاستبدال</h2></div><div class="infobox">${note?`<div>${esc(note)}</div>`:''}
 ${D.length?`<table>${D.map(x=>`<tr><td><b>${esc(x.area)}</b></td><td>${x.fee===''||x.fee==null?'':(+x.fee?esc(x.fee)+' ج.م':'مجاناً')}</td><td style="color:var(--mut)">${esc(x.days||'')}</td></tr>`).join('')}</table>`:''}
 ${pol?`<div style="margin-top:8px"><b>🔁 سياسة الاستبدال والاسترجاع</b><div style="white-space:pre-line;font-size:14px">${esc(pol)}</div></div>`:''}</div></section>`}
function trustHTML(){let t=(S.trust||[]).filter(Boolean);if(!t.length){t=[];if((S.delivery||[]).length)t.push('🚚 توصيل');if(String(S.policy||'').trim())t.push('🔁 استبدال');if((S.works||[]).length)t.push('🏗️ أعمال حقيقية');if((S.reviews||[]).length)t.push('⭐ آراء عملاء')}
 return t.length?`<div class="trust">${t.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}
const _pm=pubMain;
pubMain=function(){_pm();let m=$('main');if(!m)return;m.insertAdjacentHTML('afterbegin',trustHTML());m.insertAdjacentHTML('beforeend',worksHTML()+reviewsHTML()+infoHTML());
 setTimeout(()=>{let fl=document.querySelector('#ft .fl');if(fl&&!fl.dataset.x){fl.dataset.x=1;if((S.works||[]).length)fl.insertAdjacentHTML('beforeend','<a href="#works">أعمالنا</a>');if((S.delivery||[]).length||S.policy)fl.insertAdjacentHTML('beforeend','<a href="#info">التوصيل والاستبدال</a>')}},0)};
/* عرض صور الشغلانة */
document.addEventListener('click',e=>{let c=e.target.closest('[data-wk]');if(c){let w=(S.works||[]).filter(w=>w.imgs&&w.imgs.length)[+c.dataset.wk];if(!w)return;
  document.body.insertAdjacentHTML('beforeend',`<div id="wkv"><div class="wkt"><b>${esc(w.title)}</b><button type="button" data-wkx>✕</button></div><div class="wks">${w.imgs.map(u=>`<img src="${esc(u)}" alt="">`).join('')}</div>${w.desc?`<div class="wkd">${esc(w.desc)}</div>`:''}</div>`);return}
 if(e.target.closest('[data-wkx]')){let v=document.getElementById('wkv');if(v)v.remove()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){let v=document.getElementById('wkv');if(v)v.remove()}});

/* ---------- فيديو المنتج ---------- */
function embed(u){u=String(u||'').trim();if(!u)return '';let m=u.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);
 if(m)return `<iframe src="https://www.youtube-nocookie.com/embed/${m[1]}" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
 if(/\.(mp4|webm|mov)(\?|$)/i.test(u))return `<video src="${esc(u)}" controls preload="metadata" playsinline></video>`;
 return `<a class="pvask" style="display:block;text-align:center;padding:12px;border-radius:24px;text-decoration:none;font-weight:700" target="_blank" rel="noopener" href="${esc(u)}">▶️ شوف الفيديو</a>`}

/* ---------- روابط تظهر في جوجل: ?p=كود الصنف + عنوان ووصف وصورة لكل منتج ---------- */
function meta(sel,attr,val){let e=document.head.querySelector(sel);if(!e){e=document.createElement(sel.startsWith('link')?'link':'meta');let m=sel.match(/\[(\w+(?::\w+)?)="([^"]+)"\]/);if(m)e.setAttribute(m[1],m[2]);document.head.appendChild(e)}e.setAttribute(attr,val)}
const HOME={title:document.title,desc:(document.head.querySelector('meta[name="description"]')||{}).content||''};
function ld(obj){let s=document.getElementById('mk-ld');if(!s){s=document.createElement('script');s.type='application/ld+json';s.id='mk-ld';document.head.appendChild(s)}s.textContent=JSON.stringify(obj)}
function seoHome(){document.title=HOME.title;meta('meta[name="description"]','content',HOME.desc);meta('link[rel="canonical"]','href',BASE());
 ld({'@context':'https://schema.org','@type':'HardwareStore',name:S.name||'ميكانيزم',description:S.tagline||'',telephone:S.phone||'',image:S.logo||undefined,url:BASE(),address:S.address?{'@type':'PostalAddress',streetAddress:S.address,addressCountry:'EG'}:undefined})}
function seoProduct(p){let im=(p.imgs&&p.imgs[0])||p.img||'',sec=byId(S.sections,p.sec)||{},d=(p.desc||'').replace(/\s+/g,' ').slice(0,155)||((sec.name?sec.name+' — ':'')+(S.name||'ميكانيزم'));
 document.title=p.name+' | '+(S.name||'ميكانيزم');meta('meta[name="description"]','content',d);meta('meta[property="og:title"]','content',p.name);meta('meta[property="og:description"]','content',d);if(im)meta('meta[property="og:image"]','content',im);
 meta('link[rel="canonical"]','href',BASE()+'?p='+encodeURIComponent(p.id));
 ld({'@context':'https://schema.org','@type':'Product',name:p.name,description:p.desc||undefined,image:(p.imgs&&p.imgs.length?p.imgs:(im?[im]:undefined)),sku:p.code||undefined,category:sec.name||undefined,brand:{'@type':'Brand',name:S.name||'ميكانيزم'}})}
const _po=pvOpen;
pvOpen=function(id,noPush){_po(id,noPush);let p=byId(S.products,id);if(!p)return;seoProduct(p);
 try{history.replaceState(history.state,'',location.pathname+'?p='+encodeURIComponent(id))}catch(e){}
 if(p.video){let box=document.querySelector('#pv .pvi .pvprice')||document.querySelector('#pv .pvi h1');if(box&&!document.querySelector('#pv .pvvid'))box.insertAdjacentHTML('afterend',`<div class="pvbox pvvid"><h2>🎬 فيديو</h2>${embed(p.video)}</div>`)}};
const _pc=pvClose;
pvClose=function(back){_pc(back);seoHome();if(/[?&]p=/.test(location.search)){try{history.replaceState(null,'',location.pathname)}catch(e){}}};
/* فتح منتج من رابط ?p= (أو الرابط القديم #p=) */
let opened=false;
const _r3=render;render=function(){_r3();if(opened||admin)return;let id=new URLSearchParams(location.search).get('p');if(id&&byId(S.products,id)){opened=true;pvOpen(id,true)}};
window.addEventListener('popstate',()=>{if(!/[?&]p=/.test(location.search)&&!/^#p=/.test(location.hash)&&document.getElementById('pv').classList.contains('on'))pvClose(false)});
/* ---------- 🛒 شريط «كمّل الطلب» ثابت تحت أول ما العميل يضيف منتج ---------- */
document.head.insertAdjacentHTML('beforeend','<style>#goCart{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:12;display:none;align-items:center;justify-content:space-between;gap:10px;background:var(--accent);color:#fff;border:0;border-radius:16px;padding:14px 18px;font:800 16px Cairo,Tahoma,sans-serif;box-shadow:0 8px 24px #0004}#goCart.on{display:flex}body.pvon #goCart{display:none}#wa.on{bottom:calc(140px + env(safe-area-inset-bottom,0px))}.mc [data-a="cs"]{font-size:17px;padding:13px 18px;font-weight:800}</style>');
document.body.insertAdjacentHTML('beforeend','<button id="goCart" type="button"><span id="goCartT"></span><span>كمّل الطلب ←</span></button>');
document.getElementById('goCart').onclick=()=>cartOpen();
const _cu=cartUI;cartUI=function(){_cu();let n=cartN(),g=document.getElementById('goCart');if(!g)return;g.classList.toggle('on',n>0&&!admin);document.getElementById('goCartT').textContent='🛒 عندك '+n+' في طلبك'};
/* بعد «أضف للطلب» من الكارت: رسالة توضح الخطوة الجاية */
document.addEventListener('click',e=>{if(e.target.closest('[data-a="ad"],[data-pv="add"]'))setTimeout(()=>{let t=document.getElementById('goCartT');if(t){let g=document.getElementById('goCart');g.animate&&g.animate([{transform:'scale(1)'},{transform:'scale(1.05)'},{transform:'scale(1)'}],{duration:350})}},50)},true);
