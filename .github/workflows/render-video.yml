# مونتاج الفيديو في الخلفية (ميكانيزم ستوديو): كل ٥ دقايق بيبص على الطابور في سوبابيز، ولو فيه فيديو مستني بيعمله ويرفعه جاهز.
# المطلوب مرة واحدة: سر باسم VR_SECRET في Settings → Secrets and variables → Actions (القيمة اللي اتبعتتلك).
name: Render videos
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: render-videos
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VR_SECRET: ${{ secrets.VR_SECRET }}
      SB_URL: https://tkzfjeizvanfptnqvrmr.supabase.co
      SB_KEY: sb_publishable_8QP_KfvoYOyF_bZC4-fw1w_qCkfEpvZ
    steps:
      - name: فيه فيديو مستني؟
        id: q
        run: |
          if [ -z "$VR_SECRET" ]; then echo "VR_SECRET مش متسجل — ضيفه في Secrets"; echo "n=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          n=$(curl -s -X POST "$SB_URL/functions/v1/vr-worker" -H "Content-Type: application/json" -H "apikey: $SB_KEY" -d "{\"secret\":\"$VR_SECRET\",\"action\":\"peek\"}" | python3 -c 'import sys,json
try: print(json.load(sys.stdin).get("n",0))
except Exception: print(0)')
          echo "في الطابور: $n"
          echo "n=$n" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.q.outputs.n != '0'
      - uses: actions/setup-node@v4
        if: steps.q.outputs.n != '0'
        with:
          node-version: 20
      - name: تجهيز الأدوات
        if: steps.q.outputs.n != '0'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          cd studio && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.49.1 @supabase/supabase-js@2.45.4
          npx playwright install --with-deps chromium
      - name: مونتاج
        if: steps.q.outputs.n != '0'
        run: cd studio && node worker/render.mjs
