# مونتاج الفيديو في الخلفية (ميكانيزم ستوديو): العامل فاضل صاحي ~٥ ساعات ونص بيبص على الطابور كل ٢٠ ثانية، فأي فيديو بيبدأ في ثواني.
# الجدول كل ساعة بيصحّي عامل جديد (بيستنى اللي قبله يخلص) — كده دايمًا فيه عامل صاحي حتى لو جيت هب أخّر الجدول.
# مفيش سر تنسخه: العامل بيثبت لسوبابيز إنه من الريبو ده بتوكن OIDC من جيت هب وياخد السر لوحده (لو فيه VR_SECRET متسجل بيتجرب كمان).
name: Render videos
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
concurrency:
  group: render-videos
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      OLD_SECRET: ${{ secrets.VR_SECRET }}
      SB_URL: https://tkzfjeizvanfptnqvrmr.supabase.co
      SB_KEY: sb_publishable_8QP_KfvoYOyF_bZC4-fw1w_qCkfEpvZ
    steps:
      - name: فيه فيديو مستني؟
        id: q
        run: |
          VR_SECRET=""
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            oidc=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=mekanizm-vr" | jq -r '.value // empty' || true)
            [ -z "$oidc" ] && echo "::warning::مفيش توكن OIDC من جيت هب"
            if [ -n "$oidc" ]; then
              hi=$(curl -s -X POST "$SB_URL/functions/v1/vr-worker" -H "Content-Type: application/json" -H "apikey: $SB_KEY" -d "{\"action\":\"hello\",\"oidc\":\"$oidc\"}" || true)
              VR_SECRET=$(echo "$hi" | jq -r '.secret // empty' 2>/dev/null || true)
              [ -z "$VR_SECRET" ] && echo "::warning::hello: $(echo "$hi" | jq -c '{error,why}' 2>/dev/null || echo "$hi" | head -c 200)"
            fi
          fi
          [ -z "$VR_SECRET" ] && VR_SECRET=$(printf %s "$OLD_SECRET" | grep -oE '[0-9a-fA-F]{48}' | head -1 | tr A-F a-f || true)
          if [ -z "$VR_SECRET" ]; then echo "::error::ماقدرتش آخد سر العامل من السيرفر"; echo "n=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "::add-mask::$VR_SECRET"
          echo "VR_SECRET=$VR_SECRET" >> "$GITHUB_ENV"
          res=$(curl -s -X POST "$SB_URL/functions/v1/vr-worker" -H "Content-Type: application/json" -H "apikey: $SB_KEY" -d "{\"secret\":\"$VR_SECRET\",\"action\":\"peek\"}" || true)
          if echo "$res" | grep -q forbidden; then echo "::error::سر العامل مش مقبول"; fi
          n=$(echo "$res" | jq -r '.n // 0' 2>/dev/null || true)
          case "$n" in ''|*[!0-9]*) n=0;; esac
          echo "في الطابور: $n"
          echo "n=$n" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: شغال على طول (بيبص على الطابور كل ٢٠ ثانية)
        run: |
          [ -z "$VR_SECRET" ] && { echo "::error::مفيش سر للعامل"; exit 1; }
          end=$(( $(date +%s) + 320*60 )); ready=0
          while [ "$(date +%s)" -lt "$end" ]; do
            n=$(curl -s -m 20 -X POST "$SB_URL/functions/v1/vr-worker" -H "Content-Type: application/json" -H "apikey: $SB_KEY" -d "{\"secret\":\"$VR_SECRET\",\"action\":\"peek\"}" | jq -r '.n // 0' 2>/dev/null || true)
            case "$n" in ''|*[!0-9]*) n=0;; esac
            if [ "$n" != "0" ]; then
              echo "::group::فيديو جديد في الطابور ($n) — $(date -u +%H:%M:%S)"
              if [ "$ready" = "0" ]; then
                sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
                (cd studio && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.49.1 @supabase/supabase-js@2.45.4 && npx playwright install --with-deps chromium) && ready=1
              fi
              # آخر نسخة من كود المونتاج قبل كل فيديو (العامل بيفضل صاحي ساعات، فمن غير ده بيرسم بالكود القديم)
              git fetch -q --depth 1 origin main && git checkout -q FETCH_HEAD -- studio || echo "::warning::ماقدرتش أحدّث كود المونتاج — هكمل بالموجود"
              [ "$ready" = "1" ] && (cd studio && node worker/render.mjs) || echo "::warning::العامل وقف — هيحاول تاني"
              echo "::endgroup::"
            fi
            sleep 20
          done
