<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحة تحكم ستوديو</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0b0b0e;--sf:#141418;--sf2:#1c1c22;--ln:#2c2c34;--tx:#f3efe6;--mu:#b8b3a6;--g:#f6dc8a;--ok:#2fbf6b;--bad:#ff6b6b;--warn:#e0a030}
@media(prefers-color-scheme:light){:root:not([data-th=dark]){--bg:#f4f1ea;--sf:#fff;--sf2:#f0ece2;--ln:#ddd6c6;--tx:#1d1a12;--mu:#6b6556;--g:#8a6a14}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:600 15px/1.7 Cairo,Tajawal,system-ui,sans-serif;padding:max(14px,env(safe-area-inset-top)) 14px 40px}
.w{max-width:760px;margin:0 auto}h1{font-size:22px;margin:6px 0 2px}h2{font-size:17px;margin:0 0 8px}.mu{color:var(--mu);font-size:13px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:12px 0}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:600 15px Cairo,sans-serif}
button{min-height:42px;padding:8px 14px;border-radius:11px;border:1px solid var(--ln);background:var(--sf2);color:var(--tx);font:700 14px Cairo,sans-serif;cursor:pointer}
button.p{background:linear-gradient(135deg,#f6dc8a,#c99a3c);color:#1a1405;border:0}button.d{color:var(--bad)}button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 auto}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stat{background:var(--sf2);border-radius:12px;padding:10px 4px;text-align:center}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--mu)}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;color:#fff}.s-trial{background:#3b82f6}.s-active{background:var(--ok)}.s-expired{background:var(--warn);color:#1a1405}.s-blocked{background:var(--bad)}
.u{border-top:1px solid var(--ln);padding:12px 0}.u:first-child{border-top:0}.u .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.u .em{direction:ltr;unicode-bidi:plaintext;font-size:13px;color:var(--mu);word-break:break-all}.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.acts button{flex:1 1 auto;min-height:38px;font-size:13px}
.sw{display:flex;align-items:center;gap:10px}.sw input{width:auto;transform:scale(1.5)}
#msg{position:fixed;bottom:16px;inset-inline:16px;max-width:520px;margin:auto;background:#222;color:#fff;border-radius:12px;padding:12px 16px;display:none;z-index:9;text-align:center}
</style>
</head>
<body>
<div class="w">
  <h1>🛠️ لوحة تحكم ميكانيزم ستوديو</h1>
  <div class="mu">المشتركين، التجديد، والتجربة المجانية.</div>

  <div id="login" class="card" style="display:none">
    <h2>دخول الأدمن</h2>
    <label class="mu">الإيميل</label><input id="em" type="email" dir="ltr" autocomplete="username">
    <label class="mu" style="margin-top:8px;display:block">الباسورد</label><input id="pw" type="password" dir="ltr" autocomplete="current-password">
    <div class="row" style="margin-top:12px"><button class="p" id="go">دخول</button><button id="ml">رابط على الإيميل</button></div>
    <div class="mu" id="lm" style="margin-top:8px"></div>
  </div>

  <div id="app" style="display:none">
    <div class="card">
      <div class="row"><div class="mu" id="who"></div><button id="rf">🔄 تحديث</button><button id="out">خروج</button></div>
    </div>
    <div class="card"><div class="stats" id="stats"></div></div>
    <div class="card">
      <h2>⚙️ إعدادات الاشتراك</h2>
      <label class="sw"><input type="checkbox" id="gate"> <span><b>تشغيل البوابة</b> — لما تشغّلها كل الناس لازم تسجّل وتدخل بالاشتراك. وهي مقفولة الستوديو شغال زي ما هو.</span></label>
      <div class="row" style="margin-top:10px"><div><label class="mu">أيام التجربة المجانية</label><input id="td" type="number" min="0" max="365" inputmode="numeric"></div>
      <div><label class="mu">رقم واتساب التجديد</label><input id="ct" dir="ltr" inputmode="tel" placeholder="01xxxxxxxxx"></div></div>
      <button class="p" id="sv" style="margin-top:10px;width:100%">حفظ الإعدادات</button>
    </div>
    <div class="card">
      <h2>👥 المشتركين</h2>
      <input id="q" placeholder="ابحث بالاسم أو الإيميل أو الموبايل…">
      <div id="list" style="margin-top:6px"></div>
    </div>
  </div>
</div>
<div id="msg"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
'use strict';
const URL_='https://rzvncstjattlklpdtkfn.supabase.co',KEY='sb_publishable_Molr1fCzsC-VbSgTFDXc5w_F1p0-Fcr';
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sb=null,rows=[],cfg={};
const note=(m,ms)=>{const e=$('#msg');e.textContent=m;e.style.display='block';clearTimeout(note.t);note.t=setTimeout(()=>e.style.display='none',ms||2600)};
const ST={trial:'تجربة',active:'مشترك',expired:'خلصت',blocked:'موقوف'};
const dl=r=>{const t=r.status==='active'?r.paid_until:r.trial_end;if(!t)return 0;return Math.max(0,Math.ceil((new Date(t)-Date.now())/864e5))};
const fd=t=>t?new Date(t).toLocaleDateString('ar-EG',{day:'numeric',month:'numeric',year:'2-digit'}):'—';
const ago=t=>{if(!t)return 'ما دخلش';const m=Math.floor((Date.now()-new Date(t))/6e4);return m<2?'دلوقتي':m<60?'من '+m+' دقيقة':m<1440?'من '+Math.floor(m/60)+' ساعة':'من '+Math.floor(m/1440)+' يوم'};

async function boot(){
  sb=window.supabase.createClient(URL_,KEY,{auth:{lock:(n,t,fn)=>fn()}});
  sb.auth.onAuthStateChange((ev,ses)=>{if(ev==='SIGNED_IN')load();if(ev==='SIGNED_OUT')showLogin()});
  const {data}=await sb.auth.getSession();data.session?load():showLogin();
}
function showLogin(){$('#login').style.display='';$('#app').style.display='none'}
$('#go').onclick=async()=>{const em=$('#em').value.trim(),pw=$('#pw').value;if(!em||!pw)return($('#lm').textContent='اكتب الإيميل والباسورد');$('#lm').textContent='ثانية…';const r=await sb.auth.signInWithPassword({email:em,password:pw});if(r.error)$('#lm').textContent=/invalid/i.test(r.error.message)?'الإيميل أو الباسورد غلط':r.error.message};
$('#ml').onclick=async()=>{const em=$('#em').value.trim();if(!em)return($('#lm').textContent='اكتب الإيميل');const r=await sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.href}});$('#lm').textContent=r.error?r.error.message:'بعتنالك رابط على الإيميل'};
$('#out').onclick=()=>sb.auth.signOut();
$('#rf').onclick=()=>load();

async function load(){
  const r=await sb.rpc('studio_admin_list');
  if(r.error){
    if(/not_admin/.test(r.error.message)){$('#login').style.display='';$('#app').style.display='none';$('#lm').textContent='الحساب ده مش أدمن. ادخل بإيميل الأدمن (المسجّل في app_admins).';await sb.auth.signOut().catch(()=>{});return}
    return note('خطأ: '+r.error.message,4000);
  }
  rows=r.data||[];$('#login').style.display='none';$('#app').style.display='';
  const me=(await sb.auth.getUser()).data.user;$('#who').textContent=me?me.email:'';
  const c=await fetch(URL_+'/rest/v1/rpc/studio_public_cfg',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:'{}'}).then(x=>x.json()).catch(()=>({}));
  cfg=c;$('#gate').checked=!!c.gate;$('#td').value=c.trial_days==null?7:c.trial_days;$('#ct').value=c.contact||'';
  paint();
}
function paint(){
  const n=k=>rows.filter(r=>r.status===k).length;
  $('#stats').innerHTML=[['الكل',rows.length],['تجربة',n('trial')],['مشترك',n('active')],['خلصت',n('expired')],['موقوف',n('blocked')]].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');
  const q=$('#q').value.trim().toLowerCase();
  const L=rows.filter(r=>!q||[r.name,r.email,r.phone].join(' ').toLowerCase().includes(q));
  $('#list').innerHTML=L.length?L.map(r=>`<div class="u" data-id="${esc(r.owner)}">
    <div class="top"><b>${esc(r.name||'(من غير اسم)')}</b><span class="chip s-${esc(r.status)}">${ST[r.status]||r.status}${r.status==='trial'||r.status==='active'?' — باقي '+dl(r)+' يوم':''}</span></div>
    <div class="em">${esc(r.email)}${r.phone?' • '+esc(r.phone):''}</div>
    <div class="mu">سجّل ${fd(r.created_at)} • آخر دخول ${ago(r.last_seen)}${r.paid_until?' • مدفوع لحد '+fd(r.paid_until):''}</div>
    <input class="nt" placeholder="ملاحظة…" value="${esc(r.note||'')}" style="margin-top:6px;padding:8px">
    <div class="acts"><button class="p" data-a="d" data-v="30">+30 يوم</button><button class="p" data-a="d" data-v="90">+90</button><button class="p" data-a="d" data-v="365">+سنة</button><button data-a="dc">أيام تانية…</button><button data-a="t">تجربة +7</button>
    ${r.blocked?'<button data-a="u">فك الإيقاف</button>':'<button class="d" data-a="b">إيقاف</button>'}<button class="d" data-a="x">إلغاء الاشتراك</button><button data-a="n">حفظ الملاحظة</button></div></div>`).join(''):'<div class="mu">مفيش مشتركين لسه. أول ما حد يسجّل هيظهر هنا.</div>';
}
$('#q').oninput=paint;
$('#list').onclick=async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const u=b.closest('[data-id]'),id=u.dataset.id,a=b.dataset.a,row=rows.find(r=>r.owner===id),who=row.name||row.email;
  let r;b.disabled=true;
  try{
    if(a==='d')r=await sb.rpc('studio_admin_set',{p_owner:id,p_days:+b.dataset.v});
    else if(a==='dc'){const v=parseInt(prompt('كام يوم تزوّد لـ '+who+'؟'),10);if(!v||v<1){b.disabled=false;return}r=await sb.rpc('studio_admin_set',{p_owner:id,p_days:v})}
    else if(a==='t')r=await sb.rpc('studio_admin_trial',{p_owner:id,p_days:7});
    else if(a==='b'){if(!confirm('توقف حساب '+who+'؟')){b.disabled=false;return}r=await sb.rpc('studio_admin_set',{p_owner:id,p_blocked:true})}
    else if(a==='u')r=await sb.rpc('studio_admin_set',{p_owner:id,p_blocked:false});
    else if(a==='x'){if(!confirm('تلغي الاشتراك المدفوع لـ '+who+'؟ (هيفضل عنده التجربة لو لسه فاضلها)')){b.disabled=false;return}r=await sb.rpc('studio_admin_set',{p_owner:id,p_days:0})}
    else if(a==='n')r=await sb.rpc('studio_admin_set',{p_owner:id,p_note:u.querySelector('.nt').value});
    if(r&&r.error)throw r.error;note('تم ✅');await load();
  }catch(err){note('فشل: '+(err.message||err),4000);b.disabled=false}
};
$('#sv').onclick=async()=>{
  const r=await sb.rpc('studio_admin_cfg',{p_gate:$('#gate').checked,p_trial_days:parseInt($('#td').value,10),p_contact:$('#ct').value.trim()});
  r.error?note('فشل: '+r.error.message,4000):note($('#gate').checked?'اتحفظ ✅ البوابة شغالة دلوقتي':'اتحفظ ✅ البوابة مقفولة');
};
boot();
})();
</script>
</body>
</html>
