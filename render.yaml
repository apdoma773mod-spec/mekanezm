# Render Blueprint: the new shop backend on the FREE tier (sleeps after 15 min idle; the shop-PC bridges keep it awake).
# Same image works on any Docker host later: see rebuild/docker-compose.yml.
services:
  - type: web
    name: mekanizm-backend
    runtime: docker
    plan: free
    branch: tajroba-rebuild
    dockerfilePath: rebuild/backend/Dockerfile
    dockerContext: rebuild
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL     # Supabase Session pooler string ending with ?schema=mk_new (typed by the owner)
        sync: false
      - key: BRIDGE_SECRET    # same value the shop-PC bridges use
        sync: false
      - key: SMS_TOKEN
        sync: false
      - key: SUPABASE_URL     # https://<ref>.supabase.co  (uploads go to Storage, the free disk is wiped on restart)
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: mk-uploads
